name: Build Kivy APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          ccache \
          git \
          zip \
          unzip \
          openjdk-17-jdk

    # 🔥 PASTE HERE 🔥
    - name: Force clean Python tools
      run: |
        pip uninstall -y buildozer python-for-android
        pip cache purge

    - name: Install pinned Buildozer (APK only)
      run: |
        pip install buildozer==1.5.0
    # 🔥 END HERE 🔥

    - name: Clean buildozer cache
      run: |
        rm -rf .buildozer
        rm -rf ~/.buildozer

    - name: Build APK
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
