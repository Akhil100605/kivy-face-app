name: Build Kivy APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # ✅ MUST BE DEVELOP (AAB support)
      - name: Install python-for-android (stable)
        run: |
          pip install python-for-android==2023.09.16

      - name: Install Buildozer
        run: |
          pip install cython==0.29.36
          pip install buildozer==1.5.0
      - name: HARD CLEAN
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf ~/.cache/buildozer
      - name: Debug Buildozer version
        run: |
          which buildozer
          buildozer --version
          pip show buildozer
      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
