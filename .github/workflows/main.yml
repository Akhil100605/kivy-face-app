name: Build Kivy APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          openjdk-17-jdk \
          build-essential \
          git \
          zip \
          unzip

    - name: Force Java 17
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
        echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

    - name: Clean python tools
      run: |
        pip uninstall -y buildozer python-for-android || true
        pip cache purge

    - name: Install pinned tools (APK only)
      run: |
        pip install cython==0.29.36
        pip install python-for-android==2023.9.16
        pip install buildozer==1.5.0

    - name: Clean buildozer cache
      run: rm -rf .buildozer

    - name: Build APK
      run: buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk
